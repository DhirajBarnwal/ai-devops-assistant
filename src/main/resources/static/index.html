<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI DevOps Assistant</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #1a1d2e;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2d3e;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header .dot {
      width: 12px;
      height: 12px;
      background: #00ff88;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
    }

    .header span {
      font-size: 13px;
      color: #00ff88;
      margin-left: 4px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 80%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.bot .avatar {
      background: #1e3a5f;
      color: #4fa3e0;
    }

    .message.user .avatar {
      background: #1e3d2a;
      color: #00ff88;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 100%;
    }

    .message.bot .bubble {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-top-left-radius: 4px;
      color: #e0e0e0;
    }

    .message.user .bubble {
      background: #1e3d2a;
      border: 1px solid #00ff8844;
      border-top-right-radius: 4px;
      color: #e0e0e0;
    }

    .bubble pre {
      background: #0f1117;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 8px;
      font-size: 13px;
      border: 1px solid #2a2d3e;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 16px;
      border-top-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: #4fa3e0;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .input-area {
      padding: 16px 24px;
      background: #1a1d2e;
      border-top: 1px solid #2a2d3e;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .input-area textarea {
      flex: 1;
      background: #0f1117;
      border: 1px solid #2a2d3e;
      border-radius: 12px;
      padding: 12px 16px;
      color: #e0e0e0;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area textarea:focus {
      border-color: #4fa3e0;
    }

    .input-area textarea::placeholder {
      color: #555;
    }

    .send-btn {
      width: 48px;
      height: 48px;
      background: #1e3a5f;
      border: 1px solid #4fa3e044;
      border-radius: 12px;
      color: #4fa3e0;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #4fa3e0;
      color: #0f1117;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .suggestions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 24px 12px;
    }

    .suggestion {
      background: #1a1d2e;
      border: 1px solid #2a2d3e;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion:hover {
      border-color: #4fa3e0;
      color: #4fa3e0;
    }

    .chat-container::-webkit-scrollbar { width: 4px; }
    .chat-container::-webkit-scrollbar-track { background: transparent; }
    .chat-container::-webkit-scrollbar-thumb { background: #2a2d3e; border-radius: 2px; }
  </style>
</head>
<body>

<div class="header">
  <div class="dot"></div>
  <h1>AI DevOps Assistant</h1>
  <span>● Powered by Llama3</span>
</div>

<div class="chat-container" id="chat">
  <div class="message bot">
    <div class="avatar">🤖</div>
    <div class="bubble">
      👋 Hello! I'm your AI DevOps Assistant powered by Llama3.<br><br>
      Ask me anything about <strong>Docker, Jenkins, Maven, CI/CD pipelines, Kubernetes</strong>, or any DevOps topic!
    </div>
  </div>
</div>

<div class="suggestions">
  <div class="suggestion" onclick="quickAsk('How do I fix a failing Docker build?')">🐳 Docker build failing</div>
  <div class="suggestion" onclick="quickAsk('How to set up a Jenkins CI/CD pipeline?')">⚙️ Jenkins pipeline</div>
  <div class="suggestion" onclick="quickAsk('What is Kubernetes and how does it work?')">☸️ Kubernetes basics</div>
  <div class="suggestion" onclick="quickAsk('How to optimize Maven build time?')">📦 Maven optimization</div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="Ask a DevOps question..." rows="1"
    onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage()}"
    oninput="this.style.height='48px';this.style.height=this.scrollHeight+'px'">
  </textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function addMessage(text, type) {
    const msg = document.createElement('div');
    msg.className = `message ${type}`;
    const avatar = type === 'bot' ? '🤖' : '👤';
    const formattedText = text.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
                              .replace(/\n/g, '<br>');
    msg.innerHTML = `
      <div class="avatar">${avatar}</div>
      <div class="bubble">${formattedText}</div>
    `;
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const typing = document.createElement('div');
    typing.className = 'message bot';
    typing.id = 'typing';
    typing.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    `;
    chat.appendChild(typing);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();
  }

  async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, 'user');
    input.value = '';
    input.style.height = '48px';
    sendBtn.disabled = true;
    addTyping();

    try {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      const data = await response.json();
      removeTyping();
      addMessage(data.answer, 'bot');
    } catch (error) {
      removeTyping();
      addMessage('Sorry, something went wrong. Please try again.', 'bot');
    }

    sendBtn.disabled = false;
    input.focus();
  }

  function quickAsk(question) {
    input.value = question;
    sendMessage();
  }
</script>

</body>
</html>
